services:
  neo4j:
    image: neo4j:5.26-community
    container_name: medigraph-neo4j
    ports:
      # bound to localhost so the database is not reachable from other machines on the network
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env (see .env.example)}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_db_transaction_timeout: 15s
    volumes:
      - neo4j_data:/data
      - ./data/import:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j_data:
